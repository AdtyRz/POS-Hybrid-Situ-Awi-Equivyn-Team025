; Pool PHP-FPM untuk demo stress test.
; Default image php:8.4-fpm hanya memakai 5 worker, terlalu kecil untuk
; pengujian dengan concurrency 50. Nilai ini cukup untuk server rumahan;
; turunkan pm.max_children jika RAM server terbatas.
[www]
user = www-data
group = www-data

listen = 9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

access.log = /proc/self/fd/2
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s
request_terminate_timeout = 60s

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
